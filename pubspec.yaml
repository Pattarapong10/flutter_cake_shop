name: flutter_cake_shop_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1           # ใช้ font Google
  font_awesome_flutter: ^11.0.0  # ใช้ icon
  carousel_slider: ^5.1.2        # ทำ slider
  url_launcher: ^6.3.3           # ใช้โทร เปิดเว็บ เปิดเฟส เปิดแอปข้างนอก เช่น Google Maps
  flutter_map: ^8.3.2            # ทำแผนที่
  latlong2: ^0.10.1              # ละติจูด ลองจิจูด

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/